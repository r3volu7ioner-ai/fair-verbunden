<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">fAIr verbunden e.V.</title>
  <desc id="desc">Logo fAIr verbunden mit cyan-pinkem Verbindungsbogen</desc>
  <defs>
    <linearGradient id="aiA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55e6ff"/>
      <stop offset="1" stop-color="#11b9e9"/>
    </linearGradient>
    <linearGradient id="aiI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4eb4"/>
      <stop offset="1" stop-color="#ff218f"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25dcf3"/>
      <stop offset=".46" stop-color="#42cfff"/>
      <stop offset=".72" stop-color="#9a6cff"/>
      <stop offset="1" stop-color="#ff2d9d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="850">
    <text x="20" y="112" font-size="92" fill="#ffffff">f</text>
    <text x="61" y="112" font-size="92" fill="url(#aiA)">A</text>
    <text x="122" y="112" font-size="92" fill="url(#aiI)">I</text>
    <text x="151" y="112" font-size="92" fill="#ffffff">r</text>
    <text x="20" y="215" font-size="92" fill="#ffffff" letter-spacing="-4">verbunden</text>
    <text x="496" y="215" font-size="66" fill="#ffffff" font-weight="760"> e.V.</text>
  </g>

  <path d="M193 94 C270 7 420 2 548 75 C574 89 597 108 615 126"
        fill="none" stroke="url(#arc)" stroke-width="27" stroke-linecap="butt" filter="url(#softGlow)"/>
  <path d="M196 99 C291 35 424 38 531 98 C553 111 570 121 586 134"
        fill="none" stroke="url(#arc)" stroke-width="5.5" stroke-linecap="round" opacity=".95"/>
</svg>